[project]
name = "quantathon"
version = "0.1.0"
description = "Modelado y optimización de la red de transmisión eléctrica de Costa Rica (ICE) como Max-Cut, con exploración de enfoques cuánticos."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cvxpy>=1.9.2",
    "guppylang>=0.21.16",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
]

[project.scripts]
quantathon = "quantathon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantathon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
